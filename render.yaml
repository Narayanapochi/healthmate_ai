databases:
  - name: healthmate-db
    plan: free
    databaseName: healthmate
    user: healthmate_user

services:
  - type: web
    name: healthmate-web
    plan: free
    env: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn healthmate_ai.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthmate-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: 3.11.9
